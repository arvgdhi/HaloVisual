<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo</title>
<style>
  @font-face { font-family: 'Google Sans'; src: url('fonts/GoogleSans.ttf') format('truetype'); font-weight: 400 700; font-style: normal; font-display: swap; }
  :root {
    --bg: #000000;
    --rail: rgba(20, 20, 25, .92);
    --panel: #1c1c23;
    --panel2: #2c2c35;
    --line: rgba(255, 255, 255, .08);
    --line2: rgba(255, 255, 255, .15);
    --text: #f5f5f7;
    --dim: #9898a0;
    --faint: #686870;
    --a1: #0a84ff;
    --a2: #5e5ce6;
    --pink: #ff375f;
    --ok: #30d158;
    --ui: 'Google Sans', 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font: 400 14.5px/1.45 var(--ui);
    display: grid; grid-template-columns: 236px minmax(0, 1fr); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--a1); outline-offset: 2px; }

  /* ---------- iOS sidebar rail ---------- */
  .rail {
    background: var(--rail); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 20px 14px 16px; gap: 4px;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 18px; }
  .brand img { width: 38px; height: 38px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .12); }
  .brand-txt { display: flex; flex-direction: column; min-width: 0; }
  .brand-txt b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .brand-txt span { font-size: 11.5px; color: var(--dim); }

  .nav {
    display: flex; align-items: center; gap: 11px; height: 42px; padding: 0 10px;
    border: 0; border-radius: 11px; background: none; text-align: left;
    color: var(--dim); cursor: pointer; font-size: 14.5px; font-weight: 500;
    transition: background .14s, color .14s;
  }
  .nav:hover { background: rgba(255, 255, 255, .05); color: var(--text); }
  .nav[aria-current="page"] { background: rgba(255, 255, 255, .11); color: var(--text); font-weight: 600; }
  .nav-ic {
    width: 28px; height: 28px; border-radius: 7.5px; display: grid; place-items: center; flex: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22);
  }
  .nav-ic svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  .grow { flex: 1; }
  .edit-btn {
    height: 44px; border: 0; border-radius: 13px; background: var(--a1); color: #fff;
    font-weight: 600; font-size: 14.5px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 6px 20px rgba(10, 132, 255, .32); transition: transform .12s, background .14s;
  }
  .edit-btn:hover { background: #1e90ff; }
  .edit-btn:active { transform: scale(.98); }
  .edit-btn.on { background: var(--panel2); box-shadow: inset 0 0 0 1.5px var(--a1); color: #fff; }
  .edit-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rail small { display: block; color: var(--faint); font-size: 12px; padding: 8px 6px 0; line-height: 1.35; min-height: 40px; }

  /* ---------- main grouped scroll view ---------- */
  main { overflow-y: auto; padding: 28px 34px 44px; scrollbar-width: thin; scrollbar-color: #363640 transparent; }
  main > section { max-width: 840px; display: none; }
  main > section.show { display: block; }
  h1 { margin: 0 0 4px; font-size: 32px; font-weight: 700; letter-spacing: -.025em; }
  .lede { margin: 0 0 20px; color: var(--dim); max-width: 62ch; font-size: 14.5px; }

  /* iOS desktop status banner */
  .desk-banner {
    display: flex; align-items: flex-start; gap: 14px; padding: 15px 18px; margin-bottom: 22px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(10, 132, 255, .14), rgba(94, 92, 230, .12));
    border: 1px solid rgba(255, 255, 255, .11);
  }
  .desk-ic {
    width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center;
    background: linear-gradient(145deg, #0a84ff, #5e5ce6);
    box-shadow: 0 4px 14px rgba(10, 132, 255, .3), inset 0 1px 0 rgba(255, 255, 255, .28);
  }
  .desk-ic svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .desk-body { flex: 1; min-width: 0; }
  .desk-body b { display: block; font-size: 15px; font-weight: 600; }
  .desk-body p { margin: 2px 0 10px; color: var(--dim); font-size: 13px; line-height: 1.4; }
  .desk-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
  .dpill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, .07); font-size: 12px; color: var(--dim); font-weight: 500;
  }
  .dpill i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .dpill.on { color: var(--text); background: rgba(48, 209, 88, .14); }
  .dpill.on i { background: var(--ok); box-shadow: 0 0 8px rgba(48, 209, 88, .7); }
  .dpill.warn { color: var(--text); background: rgba(255, 159, 10, .14); }
  .dpill.warn i { background: #ff9f0a; box-shadow: 0 0 8px rgba(255, 159, 10, .7); }
  .desk-actions { display: flex; flex-direction: column; gap: 7px; flex: none; }
  .pill-btn {
    height: 32px; padding: 0 13px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .14);
    background: rgba(255, 255, 255, .08); color: var(--text); font-size: 12.5px; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: background .14s;
  }
  .pill-btn:hover { background: rgba(255, 255, 255, .15); }
  .pill-btn.pri { border: 0; background: var(--a1); color: #fff; }
  .pill-btn.pri:hover { background: #1e90ff; }

  /* iOS grouped inset cards */
  .mod { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 6px 18px 8px; margin-bottom: 16px; }
  .mod > h2 { margin: 0; padding: 14px 0 2px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .mod > p { margin: 0 0 6px; padding: 0 0 6px; color: var(--dim); font-size: 12.5px; }

  .row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
    gap: 6px 14px; min-height: 50px; padding: 10px 0; border-top: 1px solid var(--line);
  }
  .row.has-ico { grid-template-columns: 30px minmax(0, 1fr) auto; }
  .row:first-of-type, h2 + .row, p + .row { border-top: 0; }
  .ri {
    width: 30px; height: 30px; border-radius: 7.5px; display: grid; place-items: center; flex: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
  }
  .ri svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .row .lab { display: flex; flex-direction: column; min-width: 0; font-size: 14.5px; font-weight: 500; }
  .row .lab span { color: var(--dim); font-size: 12.2px; font-weight: 400; margin-top: 1px; }
  .row .ctl { display: flex; align-items: center; justify-content: flex-end; }
  .row.block .ctl { grid-column: 1 / -1; justify-content: flex-start; margin-top: 6px; }
  .row.has-ico.block .ctl { padding-left: 44px; }
  .row.full .ctl, .row-full { grid-column: 1 / -1; }

  /* iOS switch */
  .sw { position: relative; width: 48px; height: 28px; flex: none; display: inline-block; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .sw i {
    position: absolute; inset: 0; border-radius: 14px; background: #39393f;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); transition: background .2s;
  }
  .sw i::after {
    content: ''; position: absolute; left: 2px; top: 2px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .35);
    transition: transform .22s cubic-bezier(.32, 1.15, .4, 1);
  }
  .sw input:checked + i { background: var(--ok); }
  .sw input:checked + i::after { transform: translateX(20px); }
  .sw input:focus-visible + i { outline: 3px solid var(--a1); outline-offset: 3px; }
  .sw input:disabled + i { opacity: .4; }

  /* iOS slider */
  .fader { display: flex; align-items: center; gap: 12px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 210px; height: 24px; background: none; margin: 0; cursor: pointer; --pct: 50%; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--a1) 0 / var(--pct) 100% no-repeat, rgba(255, 255, 255, .14); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .55), 0 0 0 1px rgba(0, 0, 0, .12); border: 0;
  }
  .lcd {
    display: flex; align-items: baseline; gap: 3px; width: 84px; height: 32px; padding: 0 9px;
    border-radius: 9px; background: rgba(118, 118, 128, .2);
  }
  .lcd input { width: 100%; min-width: 0; border: 0; background: none; text-align: right; font: 600 14px var(--ui); font-variant-numeric: tabular-nums; outline: none; -moz-appearance: textfield; }
  .lcd input::-webkit-outer-spin-button, .lcd input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .lcd:focus-within { box-shadow: inset 0 0 0 1.5px var(--a1); }
  .lcd u { text-decoration: none; color: var(--dim); font-size: 11.5px; min-width: 1em; }

  /* iOS segmented control */
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: rgba(118, 118, 128, .22); }
  .seg button { height: 29px; padding: 0 14px; border: 0; border-radius: 7.5px; background: none; color: var(--dim); cursor: pointer; font-size: 13px; font-weight: 500; transition: background .14s, color .14s; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: #3a3a43; color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); }

  /* chips + swatches */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    height: 33px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line2);
    background: var(--panel2); color: var(--dim); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500;
  }
  .chip:hover { color: var(--text); border-color: rgba(255, 255, 255, .26); }
  .chip[aria-pressed="true"] { color: #fff; border-color: var(--a1); background: rgba(10, 132, 255, .2); box-shadow: 0 0 0 1px var(--a1); }
  .dot { width: 15px; height: 15px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); flex: none; }
  .color { width: 42px; height: 32px; padding: 0; border: 1px solid var(--line2); border-radius: 10px; background: none; cursor: pointer; }
  .color::-webkit-color-swatch-wrapper { padding: 3px; } .color::-webkit-color-swatch { border: 0; border-radius: 7px; }
  .pair { display: flex; align-items: center; gap: 8px; }

  input[type=text] { width: 270px; height: 35px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: rgba(118, 118, 128, .18); outline: none; }
  input[type=text]:focus { border-color: var(--a1); }
  .fp { position: relative; width: 290px; }
  .fp input { width: 100%; padding-right: 34px; }
  .fp .caret { position: absolute; right: 4px; top: 4px; width: 27px; height: 27px; border: 0; border-radius: 7px; background: none; color: var(--dim); cursor: pointer; }
  .fp .caret::before { content: ''; display: block; margin: 0 auto; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); }
  .fplist { display: none; position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); max-height: 320px; overflow-y: auto; padding: 5px; border-radius: 13px; background: #22222a; box-shadow: 0 18px 50px rgba(0, 0, 0, .65), 0 0 0 1px var(--line2); scrollbar-width: thin; scrollbar-color: #3a3f58 transparent; }
  .fp.open .fplist { display: block; }
  .fpi { padding: 7px 10px; border-radius: 8px; font-size: 16.5px; line-height: 1.25; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; content-visibility: auto; contain-intrinsic-size: auto 34px; }
  .fpi:hover, .fpi.hl { background: rgba(255, 255, 255, .08); }
  .fpi[aria-selected="true"] { box-shadow: inset 3px 0 0 var(--a1); background: rgba(10, 132, 255, .18); }
  .fpempty { padding: 10px; color: var(--faint); font-size: 13px; }
  .theme-row { display: flex; align-items: center; justify-content: space-between; margin: -2px 0 12px; padding: 10px 14px; border-radius: 13px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); font-size: 13.5px; }
  .preview-line { width: 100%; padding: 14px 16px; border-radius: 12px; background: #101015; box-shadow: inset 0 0 0 1px var(--line); font-size: 24px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  .btn { height: 34px; padding: 0 15px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); cursor: pointer; font-weight: 500; font-size: 13.5px; white-space: nowrap; transition: background .14s; }
  .btn:hover:not(:disabled) { background: #363642; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.pri { border: 0; background: var(--a1); color: #fff; font-weight: 600; }
  .btn.pri:hover:not(:disabled) { background: #1e90ff; }
  .btn.ok { border: 0; background: var(--ok); color: #05220e; font-weight: 700; }
  .btn.danger { color: #ff6961; border-color: rgba(255, 105, 97, .28); }
  .btn.danger:hover:not(:disabled) { background: rgba(255, 69, 58, .18); }
  kbd { padding: 3px 8px; border-radius: 7px; background: rgba(118, 118, 128, .22); box-shadow: inset 0 0 0 1px var(--line); font: 600 12px var(--ui); }

  .up-wrap { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .up-bar { height: 4px; width: 100%; border-radius: 2px; background: rgba(255, 255, 255, .1); overflow: hidden; display: none; }
  .up-bar.show { display: block; }
  .up-bar i { display: block; height: 100%; width: 0%; background: var(--a1); transition: width .15s linear; }

  /* ---------- style gallery cards ---------- */
  .gal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 24px 0 11px; }
  .gal-head:first-of-type { margin-top: 6px; }
  .gal-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .gal-head span { color: var(--dim); font-size: 12.5px; text-align: right; }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .card {
    position: relative; display: flex; flex-direction: column; align-items: stretch; width: 100%;
    padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--panel);
    overflow: hidden; text-align: left; cursor: pointer;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, .24); }
  .card[aria-pressed="true"] { border-color: var(--a1); box-shadow: 0 0 0 1.5px var(--a1), 0 8px 26px rgba(10, 132, 255, .25); }
  .th-wrap { width: 100%; display: block; flex: none; }
  .card .meta { padding: 10px 13px 13px; width: 100%; }
  .card b { display: block; font-size: 14px; font-weight: 600; }
  .card span { display: block; margin-top: 2px; color: var(--dim); font-size: 12px; line-height: 1.35; }
  .card .tick {
    position: absolute; right: 9px; top: 9px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--a1); display: none; place-items: center; font-size: 12px; font-weight: 700; color: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
  }
  .card[aria-pressed="true"] .tick { display: grid; }

  /* thumbnails: full-bleed inside every card */
  .th {
    position: relative; width: 100%; height: 120px; overflow: hidden; display: grid; place-items: center;
    font-size: 15px; font-weight: 700; color: #fff;
    background: linear-gradient(145deg, #1b1d2b, #292242);
  }
  .g-kinetic .th { background: linear-gradient(145deg, #24193c, #491f58); }
  .g-motion .th { background: linear-gradient(145deg, #132131, #1e3159); }
  .g-native .th { background: #202028; }
  .g-disc .th { background: radial-gradient(circle at 30% 25%, #25283a, #12131a); }
  .th .dim { opacity: .42; } .th .sm { font-size: .72em; opacity: .62; font-weight: 600; }
  .th svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .th .stack { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 0 10px; line-height: 1.1; }
  .th .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; background: #fff; vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  .th .redcaret { background: #ff453a; }
  @keyframes blink { 50% { opacity: 0; } }
  .th .pillw { padding: 1px .45em .1em; border-radius: .3em; background: var(--a1); }
  .th .code { font: 500 10px/1.7 Consolas, 'DejaVu Sans Mono', monospace; white-space: nowrap; overflow: hidden; background: #12141a; border-radius: 9px; padding: 9px 11px; width: 88%; box-shadow: 0 6px 18px rgba(0, 0, 0, .4); text-align: left; }
  .th .code i { font-style: normal; } .k { color: #c678dd; } .f { color: #61afef; } .s { color: #98c379; } .gr { color: #5c6370; }
  .th .bub { position: absolute; padding: 5px 10px; border-radius: 12px; font: 500 11px var(--ui); white-space: nowrap; }
  .th .row2 { position: absolute; left: 9%; right: 9%; height: 24px; border-radius: 9px; background: #fff; display: flex; align-items: center; gap: 7px; padding: 0 8px; color: #111; font: 600 10px var(--ui); white-space: nowrap; }
  .th .row2 em { width: 14px; height: 14px; border-radius: 50%; flex: none; } .th .row2 u { text-decoration: none; margin-left: auto; color: #0a9f4f; }
  .th .mapbg { position: absolute; inset: 0; background: #e9e6dc; background-image: repeating-linear-gradient(0deg, #fff 0 5px, transparent 5px 34px), repeating-linear-gradient(90deg, #fff 0 5px, transparent 5px 34px), repeating-linear-gradient(90deg, #fbe39a 0 7px, transparent 7px 102px); }
  .th .notif { position: absolute; left: 8%; right: 8%; height: 32px; border-radius: 10px; background: rgba(44, 44, 52, .95); color: #fff; font: 600 10px/1.25 var(--ui); padding: 5px 9px 0 34px; white-space: nowrap; overflow: hidden; }
  .th .notif::before { content: ''; position: absolute; left: 7px; top: 7px; width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(#5bf675, #0ebe2b); }

  @media (max-width: 880px) {
    body { grid-template-columns: 190px minmax(0, 1fr); }
    main { padding: 22px 20px; }
    input[type=range] { width: 150px; }
    input[type=text] { width: 200px; }
    .desk-banner { flex-wrap: wrap; }
    .desk-actions { flex-direction: row; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<nav class="rail" aria-label="Settings">
  <div class="brand">
    <img src="build/logo.png" alt="">
    <div class="brand-txt"><b>Halo</b><span id="brand-ver">Desktop overlay</span></div>
  </div>
  <button class="nav" data-tab="styles"><span class="nav-ic" style="background:#ff375f"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 4.7L19 9.5l-4 3.4 1.2 5.1L12 15.3 7.8 18 9 12.9 5 9.5l5.1-1.8z"/></svg></span><span>Styles</span></button>
  <button class="nav" data-tab="lyrics"><span class="nav-ic" style="background:#bf5af2"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h11M4 17h14"/></svg></span><span>Lyrics</span></button>
  <button class="nav" data-tab="glow"><span class="nav-ic" style="background:#ff9f0a"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><rect x="7.5" y="9" width="9" height="6" rx="1.5" opacity=".55"/></svg></span><span>Glow</span></button>
  <button class="nav" data-tab="record"><span class="nav-ic" style="background:#0a84ff"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.8"/></svg></span><span>Record</span></button>

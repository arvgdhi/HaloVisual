<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo</title>
<style>
  @font-face { font-family: 'Google Sans'; src: url('fonts/GoogleSans.ttf') format('truetype'); font-weight: 400 700; font-style: normal; font-display: swap; }
  :root {
    --bg: #0b0c14; --rail: #0e1019; --panel: #131522; --panel2: #1b1e2e; --line: #262a3b; --line2: #353a50;
    --text: #eeeef5; --dim: #9a9db3; --faint: #686c84; --a1: #ff5a47; --a2: #ff9a5a; --ok: #5be3a0;
    --ui: 'Google Sans', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    --grad: linear-gradient(90deg, var(--a1), var(--a2));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font: 400 14.5px/1.45 var(--ui);
    display: grid; grid-template-columns: 216px minmax(0, 1fr); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }

  /* ---------- rail ---------- */
  .rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 14px 16px; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 22px; }
  .brand img { width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 6px 18px rgba(255, 90, 71, .3); }
  .brand b { font-size: 23px; font-weight: 700; letter-spacing: -.01em; }
  .nav { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: none; text-align: left; color: var(--dim); cursor: pointer; font-size: 14.5px; }
  .nav:hover { background: rgba(255, 255, 255, .04); color: var(--text); }
  .nav[aria-current="page"] { background: var(--panel2); color: var(--text); }
  .nav[aria-current="page"]::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: linear-gradient(var(--a1), var(--a2)); }
  .nav svg { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .nav[aria-current="page"] svg { color: var(--a2); opacity: 1; }
  .grow { flex: 1; }
  .edit-btn { height: 44px; border: 0; border-radius: 12px; background: var(--grad); color: #fff; font-weight: 600; font-size: 14.5px; cursor: pointer; box-shadow: 0 6px 22px rgba(255, 90, 71, .34); }
  .edit-btn.on { background: #2a2a35; box-shadow: inset 0 0 0 1.5px var(--a2); }
  .rail small { display: block; color: var(--faint); font-size: 12px; padding: 8px 6px 0; line-height: 1.35; min-height: 44px; }

  /* ---------- content ---------- */
  main { overflow-y: auto; padding: 30px 34px 40px; scrollbar-width: thin; scrollbar-color: #33333f transparent; }
  main > section { max-width: 820px; display: none; }
  main > section.show { display: block; }
  h1 { margin: 0 0 4px; font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .lede { margin: 0 0 22px; color: var(--dim); max-width: 60ch; }
  .mod { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 8px 22px 10px; margin-bottom: 16px; }
  .mod > h2 { margin: 0; padding: 16px 0 2px; font-size: 16px; font-weight: 700; letter-spacing: -.005em; }
  .mod > p { margin: 0 0 6px; padding: 0 0 6px; color: var(--dim); font-size: 12.5px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 18px; min-height: 46px; padding: 7px 0; border-top: 1px solid var(--line); }
  .row:first-of-type, h2 + .row, p + .row { border-top: 0; }
  .row .lab { display: flex; flex-direction: column; min-width: 0; }
  .row .lab span { color: var(--faint); font-size: 12.2px; }
  .row.block { grid-template-columns: 1fr; }

  /* switch */
  .sw { position: relative; width: 42px; height: 24px; flex: none; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .sw i { position: absolute; inset: 0; border-radius: 12px; background: #2a2a35; box-shadow: inset 0 0 0 1px var(--line2); transition: background .18s; }
  .sw i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #c9c7d6; transition: transform .18s, background .18s; }
  .sw input:checked + i { background: var(--grad); box-shadow: 0 0 14px rgba(255, 90, 71, .4); }
  .sw input:checked + i::after { transform: translateX(18px); background: #fff; }
  .sw input:focus-visible + i { outline: 2px solid var(--a1); outline-offset: 2px; }
  .sw input:disabled + i { opacity: .4; }

  /* fader */
  .fader { display: flex; align-items: center; gap: 14px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 230px; height: 22px; background: none; margin: 0; cursor: pointer; --pct: 50%; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--a1), var(--a2)) 0 / var(--pct) 100% no-repeat, #2d2d39; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 22px; margin-top: -9px; border-radius: 5px; background: linear-gradient(#f4f3fa, #bdbbcb); box-shadow: 0 2px 6px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(255, 255, 255, .6); border: 0; }
  .lcd { display: flex; align-items: baseline; gap: 4px; width: 92px; height: 32px; padding: 0 9px; border-radius: 8px; background: #09090d; box-shadow: inset 0 0 0 1px var(--line); }
  .lcd input { width: 100%; min-width: 0; border: 0; background: none; text-align: right; font: 600 15px var(--ui); font-variant-numeric: tabular-nums; outline: none; -moz-appearance: textfield; }
  .lcd input::-webkit-outer-spin-button, .lcd input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .lcd:focus-within { box-shadow: inset 0 0 0 1.5px var(--a1); }
  .lcd u { text-decoration: none; color: var(--faint); font-size: 12px; min-width: 1.2em; }

  /* segmented */
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: #0e0e13; box-shadow: inset 0 0 0 1px var(--line); }
  .seg button { height: 30px; padding: 0 14px; border: 0; border-radius: 8px; background: none; color: var(--dim); cursor: pointer; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--panel2); color: var(--text); box-shadow: 0 0 0 1px var(--line2), 0 2px 8px rgba(0, 0, 0, .4); }

  /* chips + swatches */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); color: var(--dim); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .chip:hover { color: var(--text); border-color: #4a4a58; }
  .chip[aria-pressed="true"] { color: var(--text); border-color: transparent; box-shadow: 0 0 0 2px var(--a1), 0 0 18px rgba(255, 90, 71, .28); }
  .dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); flex: none; }
  .color { width: 46px; height: 32px; padding: 0; border: 1px solid var(--line2); border-radius: 9px; background: none; cursor: pointer; }
  .color::-webkit-color-swatch-wrapper { padding: 3px; } .color::-webkit-color-swatch { border: 0; border-radius: 6px; }
  .pair { display: flex; align-items: center; gap: 8px; }

  input[type=text] { width: 270px; height: 34px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line2); background: #0e0e13; outline: none; }
  input[type=text]:focus { border-color: var(--a1); }
  .fp { position: relative; width: 290px; }
  .fp input { width: 100%; padding-right: 34px; }
  .fp .caret { position: absolute; right: 4px; top: 4px; width: 26px; height: 26px; border: 0; border-radius: 7px; background: none; color: var(--dim); cursor: pointer; }
  .fp .caret::before { content: ''; display: block; margin: 0 auto; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); }
  .fplist { display: none; position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); max-height: 320px; overflow-y: auto; padding: 5px; border-radius: 12px; background: #161828; box-shadow: 0 18px 50px rgba(0, 0, 0, .6), 0 0 0 1px var(--line2); scrollbar-width: thin; scrollbar-color: #3a3f58 transparent; }
  .fp.open .fplist { display: block; }
  .fpi { padding: 7px 10px; border-radius: 8px; font-size: 17px; line-height: 1.25; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; content-visibility: auto; contain-intrinsic-size: auto 34px; }
  .fpi:hover, .fpi.hl { background: #232739; }
  .fpi[aria-selected="true"] { box-shadow: inset 3px 0 0 var(--a1); background: #1f2335; }
  .fpempty { padding: 10px; color: var(--faint); font-size: 13px; }
  .theme-row { display: flex; align-items: center; justify-content: space-between; margin: -4px 0 14px; padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); font-size: 13.5px; }
  .preview-line { margin-top: 10px; padding: 14px 16px; border-radius: 12px; background: #0c0c11; box-shadow: inset 0 0 0 1px var(--line); font-size: 24px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .btn { height: 34px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); cursor: pointer; }
  .btn:hover { border-color: #55556a; }
  .btn.danger:hover { border-color: #ff6b81; color: #ff9aa9; }
  .note { color: var(--faint); font-size: 12.5px; margin: 4px 0 8px; }
  kbd { padding: 2px 7px; border-radius: 6px; background: #0e0e13; box-shadow: inset 0 0 0 1px var(--line2); font: 600 12px var(--ui); }

  /* ---------- gallery ---------- */
  .gal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 26px 0 12px; }
  .gal-head:first-of-type { margin-top: 4px; }
  .gal-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .gal-head span { color: var(--dim); font-size: 12.5px; text-align: right; }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 14px; }
  .card { position: relative; display: flex; flex-direction: column; padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; text-align: left; cursor: pointer; transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-2px); border-color: #4a4a58; }
  .card[aria-pressed="true"] { border-color: transparent; box-shadow: 0 0 0 2px var(--a1), 0 8px 30px rgba(255, 90, 71, .26); }
  .card .meta { padding: 10px 12px 13px; }
  .card b { display: block; font-size: 14px; font-weight: 600; }
  .card span { display: block; margin-top: 2px; color: var(--dim); font-size: 12px; line-height: 1.35; }
  .card .tick { position: absolute; right: 9px; top: 9px; width: 20px; height: 20px; border-radius: 50%; background: var(--grad); display: none; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
  .card[aria-pressed="true"] .tick { display: grid; }

  /* thumbnails: drawn in CSS, one per style */
  .th { position: relative; height: 112px; overflow: hidden; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: #fff; background: linear-gradient(145deg, #1d1d2b, #2a2140); }
  .g-kinetic .th { background: linear-gradient(145deg, #261b3d, #4a2159); }
  .g-motion .th { background: linear-gradient(145deg, #15222f, #1f2f55); }
  .g-native .th { background: #20202a; }
  .th .dim { opacity: .4; } .th .sm { font-size: .7em; opacity: .55; font-weight: 600; }
  .th svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .th .stack { display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
  .th .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; background: #fff; vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  .th .redcaret { background: #ff3b4d; }
  @keyframes blink { 50% { opacity: 0; } }
  .th .pillw { padding: 0 .4em .05em; border-radius: .25em; background: var(--a1); }
  .th .code { font: 500 10px/1.7 Consolas, 'DejaVu Sans Mono', monospace; white-space: nowrap; overflow: hidden; background: #12141a; border-radius: 8px; padding: 8px 10px; width: 90%; box-shadow: 0 6px 18px rgba(0, 0, 0, .4); text-align: left; }
  .th .code i { font-style: normal; } .k { color: #c678dd; } .f { color: #61afef; } .s { color: #98c379; } .gr { color: #5c6370; }
  .th .bub { position: absolute; padding: 4px 10px; border-radius: 12px; font: 500 11px var(--ui); white-space: nowrap; }
  .th .row2 { position: absolute; left: 10%; right: 10%; height: 24px; border-radius: 9px; background: #fff; display: flex; align-items: center; gap: 7px; padding: 0 7px; color: #111; font: 600 10px var(--ui); white-space: nowrap; }
  .th .row2 em { width: 14px; height: 14px; border-radius: 50%; flex: none; } .th .row2 u { text-decoration: none; margin-left: auto; color: #0a9f4f; }
  .th .mapbg { position: absolute; inset: 0; background: #e9e6dc; background-image: repeating-linear-gradient(0deg, #fff 0 5px, transparent 5px 34px), repeating-linear-gradient(90deg, #fff 0 5px, transparent 5px 34px), repeating-linear-gradient(90deg, #fbe39a 0 7px, transparent 7px 102px); }
  .th .notif { position: absolute; left: 9%; right: 9%; height: 30px; border-radius: 10px; background: rgba(44, 44, 52, .95); color: #fff; font: 600 10px/1.2 var(--ui); padding: 5px 9px 0 34px; white-space: nowrap; overflow: hidden; }
  .th .notif::before { content: ''; position: absolute; left: 7px; top: 6px; width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(#5bf675, #0ebe2b); }

  @media (max-width: 880px) { body { grid-template-columns: 180px minmax(0, 1fr); } main { padding: 22px 20px; } input[type=range] { width: 160px; } input[type=text] { width: 200px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<nav class="rail" aria-label="Settings">
  <div class="brand"><img src="build/logo.png" alt=""><b>Halo</b></div>
  <button class="nav" data-tab="styles"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Styles</span></button>
  <button class="nav" data-tab="lyrics"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 11h10M4 16h16M4 21h7"/></svg><span>Lyrics</span></button>
  <button class="nav" data-tab="glow"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><rect x="7.5" y="9" width="9" height="6" rx="1.5" opacity=".5"/></svg><span>Glow</span></button>
  <button class="nav" data-tab="record"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r=".6"/></svg><span>Record</span></button>
  <button class="nav" data-tab="layout"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span>Layout</span></button>
  <button class="nav" data-tab="general"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>General</span></button>
  <div class="grow"></div>
  <button class="edit-btn" id="edit">Edit on screen</button>
  <small id="editnote">Drag the lyrics and the record where you want them.</small>
</nav>
<main>
  <section id="tab-styles"></section>
  <section id="tab-lyrics"></section>
  <section id="tab-glow"></section>
  <section id="tab-record"></section>
  <section id="tab-layout"></section>
  <section id="tab-general"></section>
</main>
<script src="settings.js"></script>
</body>
</html>

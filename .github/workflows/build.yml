name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'index.html'
      - 'site.css'
      - 'site.js'
      - 'assets/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem -Path dist -Filter 'Halo-Setup-*.exe' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          if (-not $lines) { throw 'No installer found in dist/' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path dist) 'SHA256SUMS.txt'), [string[]]$lines, $utf8NoBom)
          Get-Content dist/SHA256SUMS.txt
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Halo-Setup
          path: |
            dist/Halo-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Halo-Setup-*.exe
            dist/SHA256SUMS.txt
